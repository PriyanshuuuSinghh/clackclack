<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test | Hacker Edition</title>
    <style>
        /* --- RESTORING THE VISUALS FROM SECOND SCREENSHOT --- */
        :root {
            --bg-color: #0d0d0d;
            --main-green: #00ff41;
            --dim-green: #003b00;
            --error-red: #ff3333;
            --sub-color: #555555;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px var(--main-green);
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-center {
            display: flex;
            background: #161616;
            padding: 10px 20px;
            border-radius: 6px;
            gap: 15px;
            align-items: center;
            border: 1px solid var(--dim-green);
            font-size: 0.85rem;
            
        }
        .time-group {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: 15px;
}

#timer-display {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--main-green);
    text-shadow: 0 0 8px var(--main-green);
    min-width: 30px;
}

.time-option {
    cursor: pointer;
    color: var(--sub-color);
    transition: 0.2s ease;
}

.time-option:hover {
    color: var(--main-green);
}

.time-option.active {
    color: var(--main-green);
    text-shadow: 0 0 6px var(--main-green);
}

        .active { color: var(--main-green); text-shadow: 0 0 5px var(--main-green); }
        .config-item { color: var(--sub-color); }

        /* Typing Area */
        .typing-test-container {
            position: relative;
            font-size: 1.8rem;
            min-height: 150px;
            cursor: text;
        }

        .words-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6em;
            line-height: 1.6;
            user-select: none;
        }

        .word { color: var(--dim-green); }
        .word.active-word { color: var(--sub-color); }

        .char.correct { color: var(--main-green); text-shadow: 0 0 5px var(--main-green); }
        .char.incorrect { color: var(--error-red); text-shadow: 0 0 8px var(--error-red); }

        /* Caret/Cursor */
        .caret {
            position: absolute;
            width: 2px;
            height: 2.2rem;
            background-color: var(--main-green);
            box-shadow: 0 0 10px var(--main-green);
            animation: blink 1s infinite;
            transition: 0.1s linear;
        }

        @keyframes blink { 50% { opacity: 0; } }

        #typing-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Footer Reset */
        .footer { text-align: center; }
        .reset-btn {
            background: none;
            border: none;
            color: var(--sub-color);
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .reset-btn:hover { color: var(--main-green); transform: rotate(180deg); }

        /* Glitch Animation for Click */
        .glitch-flash { animation: glitch 0.2s linear; }
        @keyframes glitch {
            0% { transform: translate(0); background: #00ff4111; }
            50% { transform: translate(-3px, 3px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body onclick="document.getElementById('typing-input').focus()">

    <div class="page-wrapper">
        <header class="navbar">
            <div class="nav-left">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="var(--main-green)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span>Typing Test</span>
            </div>
            <div class="nav-center">
    <span class="config-item">@ punctuation</span>
    <span class="config-item"># numbers</span>
    <span class="active">clock time</span>
    <span class="config-item">A words</span>

    <div class="time-group">
        <div id="timer-display" class="big-timer">15</div>

        <span class="time-option active" data-time="15">15</span>
        <span class="time-option" data-time="30">30</span>
        <span class="time-option" data-time="60">60</span>
        <span class="time-option" data-time="120">120</span>
    </div>
</div>
            <div class="nav-right" style="color: var(--main-green); opacity: 0.8;">🔔 👤</div>
        </header>

        <main class="typing-test-container">
            <div id="caret" class="caret"></div>
            <div id="words-wrapper" class="words-wrapper"></div>
            <input type="text" id="typing-input" autocomplete="off" autofocus>
            <div id="result-overlay" class="result-overlay hidden">
    <div class="result-box">
        <h2>Test Complete</h2>
        <p>WPM: <span id="final-wpm">0</span></p>
        <p>Accuracy: <span id="final-accuracy">0%</span></p>
        <p>Correct: <span id="final-correct">0</span></p>
        <p>Incorrect: <span id="final-incorrect">0</span></p>
        <button id="restart-btn">Restart</button>
    </div>
</div>
        </main>

        <footer class="footer">
            <button class="reset-btn" id="reset-test">⟳</button>
        </footer>
    </div>

   <script src="script.js"></script>
</body>
</html>
